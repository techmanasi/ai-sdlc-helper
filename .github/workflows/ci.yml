name: CI

# Markdown-only changes skip the test matrix: lint owns docs PRs (see lint.yml).
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Smoke test the built command
        run: |
          node dist/bin.js --version
          node dist/bin.js detect .
          node dist/bin.js show . > /dev/null
          node dist/bin.js skill plan . > /dev/null
