name: Lint

# Markdown-only changes skip CI and E2E, so this workflow always runs and gives
# docs-only pull requests a check without spending the test matrix.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
