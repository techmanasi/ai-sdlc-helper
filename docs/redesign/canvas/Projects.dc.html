<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Projects</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif}
a{color:#5eead4}a:hover{color:#99f6e4}
</style>
</helmet>
<div style="width: 1320px; height: 600px; box-sizing: border-box; background: #0f1218; color: #e6e9ef; display: flex; position: relative">

<div style="flex: none; width: 56px; position: relative; z-index: 20">
<nav aria-label="Main" style="position: absolute; top: 0; left: 0; bottom: 0; width: {{navWidth}}; box-sizing: border-box; background: #12161d; border-right: 1px solid #222a36; box-shadow: {{navShadow}}; padding: 10px 8px; display: flex; flex-direction: column; gap: 4px; overflow: hidden">
<div style="display: flex; align-items: center; gap: 8px; min-height: 40px">
<button type="button" onClick="{{toggleNav}}" aria-label="{{navToggleLabel}}" aria-expanded="{{navExpanded}}" style="flex: none; width: 40px; height: 40px; border-radius: 6px; border: 0; background: transparent; color: #c9d1dc; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"></path></svg></button>
<sc-if value="{{navOpen}}" hint-placeholder-val="{{false}}"><span style="font-family: ui-monospace, Menlo, monospace; font-size: 13px; font-weight: 600; white-space: nowrap">ai-sdlc-helper <span style="color: #8e98a8; font-weight: 400">0.1.1</span></span></sc-if>
</div>
<sc-if value="{{navOpen}}" hint-placeholder-val="{{false}}"><div style="font-size: 11px; letter-spacing: 0.08em; color: #8e98a8; padding: 10px 12px 4px">WORKSPACE</div></sc-if>
<sc-if value="{{navClosed}}" hint-placeholder-val="{{true}}"><div style="height: 1px; background: #222a36; margin: 8px 6px"></div></sc-if>
<a href="Board.dc.html" title="Board" style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 12px; border-radius: 6px; background: transparent; color: #c9d1dc; font-size: 13px; text-decoration: none"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" style="flex: none"><rect x="2.5" y="2.5" width="4.5" height="11" rx="1"></rect><rect x="9" y="2.5" width="4.5" height="7" rx="1"></rect></svg><sc-if value="{{navOpen}}" hint-placeholder-val="{{false}}"><span style="flex: 1; white-space: nowrap">Board</span><span style="font-size: 11px; color: #8e98a8">6</span></sc-if></a>
<a href="Completed.dc.html" title="Completed" style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 12px; border-radius: 6px; background: transparent; color: #c9d1dc; font-size: 13px; text-decoration: none"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><circle cx="8" cy="8" r="6"></circle><path d="M5.5 8.2l1.8 1.8 3.2-3.6"></path></svg><sc-if value="{{navOpen}}" hint-placeholder-val="{{false}}"><span style="flex: 1; white-space: nowrap">Completed</span><span style="font-size: 11px; color: #8e98a8">4</span></sc-if></a>
<a href="NewItem.dc.html" title="New item" style="text-decoration: none;display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 12px; border-radius: 6px; border: 0; background: transparent; color: #c9d1dc; font: inherit; font-size: 13px; text-align: left; cursor: pointer"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true" style="flex: none"><path d="M8 3v10M3 8h10"></path></svg><sc-if value="{{navOpen}}" hint-placeholder-val="{{false}}"><span style="flex: 1; white-space: nowrap">New item</span></sc-if></a>
<sc-if value="{{navOpen}}" hint-placeholder-val="{{false}}"><div style="font-size: 11px; letter-spacing: 0.08em; color: #8e98a8; padding: 14px 12px 4px">CONFIGURE</div></sc-if>
<sc-if value="{{navClosed}}" hint-placeholder-val="{{true}}"><div style="height: 1px; background: #222a36; margin: 8px 6px"></div></sc-if>
<a href="Settings.dc.html" title="Settings" style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 12px; border-radius: 6px; background: transparent; color: #c9d1dc; font-size: 13px; text-decoration: none"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true" style="flex: none"><path d="M2.5 5h11M2.5 11h11"></path><circle cx="6" cy="5" r="1.7" fill="#12161d"></circle><circle cx="10" cy="11" r="1.7" fill="#12161d"></circle></svg><sc-if value="{{navOpen}}" hint-placeholder-val="{{false}}"><span style="flex: 1; white-space: nowrap">Settings</span></sc-if></a>
<button type="button" onClick="{{closeNav}}" title="Prompts" style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 12px; border-radius: 6px; border: 0; background: transparent; color: #c9d1dc; font: inherit; font-size: 13px; text-align: left; cursor: pointer"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M2.5 3.5h11v7H7.5l-3 2.5v-2.5h-2z"></path></svg><sc-if value="{{navOpen}}" hint-placeholder-val="{{false}}"><span style="flex: 1; white-space: nowrap">Prompts</span><span style="font-size: 10px; padding: 0 5px; border: 1px dashed #4a5263; border-radius: 4px; color: #8e98a8">Future</span></sc-if></button>
<button type="button" onClick="{{closeNav}}" title="Models" style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 12px; border-radius: 6px; border: 0; background: transparent; color: #c9d1dc; font: inherit; font-size: 13px; text-align: left; cursor: pointer"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M8 2l5.5 3v6L8 14l-5.5-3V5z"></path><path d="M2.5 5L8 8l5.5-3M8 8v6"></path></svg><sc-if value="{{navOpen}}" hint-placeholder-val="{{false}}"><span style="flex: 1; white-space: nowrap">Models</span><span style="font-size: 10px; padding: 0 5px; border: 1px dashed #4a5263; border-radius: 4px; color: #8e98a8">Future</span></sc-if></button>
<sc-if value="{{navOpen}}" hint-placeholder-val="{{false}}"><div style="font-size: 11px; letter-spacing: 0.08em; color: #8e98a8; padding: 14px 12px 4px">SYSTEM</div></sc-if>
<sc-if value="{{navClosed}}" hint-placeholder-val="{{true}}"><div style="height: 1px; background: #222a36; margin: 8px 6px"></div></sc-if>
<a href="Projects.dc.html" title="Projects" aria-current="page" style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 12px; border-radius: 6px; background: #1f2735; color: #e6e9ef; font-size: 13px; text-decoration: none"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M2.5 4.5h4l1.5 1.5h5.5v6.5h-11z"></path></svg><sc-if value="{{navOpen}}" hint-placeholder-val="{{false}}"><span style="flex: 1; white-space: nowrap">Projects</span><span style="font-size: 11px; color: #8e98a8">4</span></sc-if></a>
</nav>
</div>

<main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 24px 28px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap">
<div style="display: flex; align-items: baseline; gap: 12px">
<h1 style="margin: 0; font-size: 22px; font-weight: 600">Projects</h1>
<span style="font-size: 13px; color: #8e98a8">4 repositories</span>
</div>
<div style="display: flex; gap: 10px; align-items: center; position: relative">
<button type="button" onClick="{{toggleEd}}" aria-expanded="{{edExpanded}}" style="min-height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid #2c3544; background: #151a23; color: #e6e9ef; font: inherit; font-size: 13px; display: flex; align-items: center; gap: 8px; cursor: pointer"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#aab3c2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 4.5L2 8l3.5 3.5M10.5 4.5L14 8l-3.5 3.5"></path></svg><span style="color: #8e98a8">Editor</span> {{editorName}}<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="#8e98a8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"></path></svg></button>
<button type="button" style="min-height: 40px; padding: 0 16px; border-radius: 8px; border: 0; background: #5eead4; color: #06231f; font: inherit; font-weight: 600; font-size: 14px; cursor: pointer">Add project</button>
<sc-if value="{{edOpen}}" hint-placeholder-val="{{false}}">
<div role="dialog" aria-label="Default editor" style="position: absolute; top: calc(100% + 8px); right: 0; width: 340px; z-index: 10; background: #1a202b; border: 1px solid #3a4558; border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 12px 32px rgba(0,0,0,0.45)">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 14px; font-weight: 600">Default editor</span>
<button type="button" onClick="{{toggleEd}}" aria-label="Close" style="width: 32px; height: 32px; border-radius: 6px; border: 0; background: transparent; color: #aab3c2; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"></path></svg></button>
</div>
<span style="font-size: 12px; color: #8e98a8">Used by Open in editor on every page.</span>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 4px">
<legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Editor</legend>
<sc-for list="{{editors}}" as="e" hint-placeholder-count="6">
<label style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; border-radius: 6px; background: {{e.bg}}; font-size: 13px; color: #e6e9ef; cursor: pointer"><input type="radio" name="editor" checked="{{e.checked}}" onChange="{{e.pick}}"><span style="flex: 1">{{e.name}}</span><span style="font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #8e98a8">{{e.cmd}}</span></label>
</sc-for>
</fieldset>
<sc-if value="{{isCustom}}" hint-placeholder-val="{{false}}">
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: #8e98a8">Command · {path} is the project folder<input type="text" placeholder="e.g. subl {path}" style="min-height: 36px; padding: 0 10px; border-radius: 6px; border: 1px solid #2c3544; background: #0f1218; color: #e6e9ef; font-family: ui-monospace, Menlo, monospace; font-size: 13px"></label>
</sc-if>
</div>
</sc-if>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{projects}}" as="p" hint-placeholder-count="4">
<section style="background: #151a23; border: 1px solid {{p.border}}; border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
<div style="display: flex; align-items: center; gap: 10px; min-width: 0">
<h2 style="margin: 0; font-family: ui-monospace, Menlo, monospace; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.name}}</h2>
<sc-if value="{{p.current}}" hint-placeholder-val="{{false}}"><span style="font-size: 11px; padding: 1px 8px; border-radius: 999px; background: #11262b; color: #5eead4">current</span></sc-if>
</div>
<span style="font-size: 12px; color: #8e98a8; white-space: nowrap">{{p.counts}}</span>
</div>
<div style="font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #aab3c2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.path}}</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap; font-size: 12px">
<span style="padding: 2px 8px; border-radius: 4px; border: 1px solid #2c3544; color: #aab3c2">base {{p.base}}</span>
<span style="padding: 2px 8px; border-radius: 4px; border: 1px solid #2c3544; color: {{p.runColor}}">{{p.run}}</span>
</div>
<div style="display: flex; gap: 10px; flex-wrap: wrap">
<a href="Board.dc.html" style="min-height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid #2c3544; color: #e6e9ef; font-size: 13px; text-decoration: none; display: flex; align-items: center">Open board</a>
<button type="button" title="Opens with {{editorName}}" style="min-height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid #2c3544; background: transparent; color: #e6e9ef; font: inherit; font-size: 13px; cursor: pointer">Open in editor</button>
<button type="button" style="min-height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid #2c3544; background: transparent; color: #e6e9ef; font: inherit; font-size: 13px; cursor: pointer">Copy path</button>
<a href="Settings.dc.html" style="min-height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid #2c3544; color: #e6e9ef; font-size: 13px; text-decoration: none; display: flex; align-items: center; margin-left: auto">Configure</a>
</div>
</section>
</sc-for>
</div>
</main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1320,"height":600}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { nav: false, editor: 'vscode', edOpen: false };
  }
  renderVals() {
    const projects = [
      { name: 'ai-sdlc-helper', path: '/Volumes/Work/Projects/trials/ai-sdlc-helper', base: '[base]', counts: '6 on board · 4 completed', run: '1 running', runColor: '#5eead4', current: true },
      { name: '[project]', path: '[path]', base: '[base]', counts: '[n] on board', run: 'idle', runColor: '#aab3c2', current: false },
      { name: '[project]', path: '[path]', base: '[base]', counts: '[n] on board', run: 'idle', runColor: '#aab3c2', current: false },
      { name: '[project]', path: '[path]', base: '[base]', counts: '[n] on board', run: 'idle', runColor: '#aab3c2', current: false }
    ].map((p) => Object.assign({}, p, { border: p.current ? '#1f4a52' : '#262e3b' }));
    const eds = [
      ['vscode', 'VS Code', 'code'],
      ['cursor', 'Cursor', 'cursor'],
      ['zed', 'Zed', 'zed'],
      ['idea', 'IntelliJ IDEA', 'idea'],
      ['system', 'System default', 'open'],
      ['custom', 'Custom command', '']
    ];
    return {
      projects: projects,
      editors: eds.map((e) => ({
        name: e[1], cmd: e[2], checked: this.state.editor === e[0],
        bg: this.state.editor === e[0] ? '#1f2735' : 'transparent',
        pick: () => this.setState({ editor: e[0] })
      })),
      editorName: (eds.find((e) => e[0] === this.state.editor) || eds[0])[1],
      isCustom: this.state.editor === 'custom',
      edOpen: this.state.edOpen,
      edExpanded: this.state.edOpen ? 'true' : 'false',
      toggleEd: () => this.setState({ edOpen: !this.state.edOpen }),
      navOpen: this.state.nav, navClosed: !this.state.nav,
      navWidth: this.state.nav ? '220px' : '56px',
      navShadow: this.state.nav ? '8px 0 24px rgba(0,0,0,0.45)' : 'none',
      navExpanded: this.state.nav ? 'true' : 'false',
      navToggleLabel: this.state.nav ? 'Collapse menu' : 'Expand menu',
      toggleNav: () => this.setState({ nav: !this.state.nav }),
      closeNav: () => this.setState({ nav: false })
    };
  }
}
</script>
</body>
</html>
